
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nj Store Admin</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #101522;
      color: #f0c76a;
      font-family: Arial, sans-serif;
    }
    .panel {
      width: 85%;
      max-width: 360px;
      padding: 25px;
      border: 1px solid #c9a34d;
      border-radius: 15px;
      text-align: center;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-top: 14px;
      border-radius: 7px;
      font-size: 16px;
    }
    input {
      border: 1px solid #c9a34d;
      background: #fff;
      color: #111;
    }
    button {
      border: 0;
      background: #e6bd60;
      color: #111;
      font-weight: bold;
    }
    #message {
      color: white;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main class="panel">
    <h2>Nj Store Admin</h2>
    <p>Admin Login</p>

    <form id="loginForm">
      <input id="email" type="email"
        placeholder="Email address" required>
      <input id="password" type="password"
        placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <p id="message"></p>
  </main>

  <script>
    const SUPABASE_URL =
      "https://tjyuuinymsukxggwipwf.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_zZiP_dclZ_jK46swVBicPA_QxhQuHPD";

    document.getElementById("loginForm")
      .addEventListener("submit", async function(event) {
        event.preventDefault();

        const message = document.getElementById("message");
        message.textContent = "Logging in...";

        try {
          const response = await fetch(
            SUPABASE_URL + "/auth/v1/token?grant_type=password",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "apikey": SUPABASE_KEY
              },
              body: JSON.stringify({
                email: document.getElementById("email").value,
password: document.getElementById("password").value
              })
            }
          );

          const result = await response.json();

          if (!response.ok) {
            throw new Error(
              result.msg || result.message ||
              result.error_description || "Login failed"
            );
          }

          message.textContent =
            "Login successful! Admin product features still need setup.";
        } catch (error) {
          message.textContent = "Error: " + error.message;
        }
      });
  </script>
</body>
</html>
