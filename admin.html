
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NJ Store Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#0b1220;color:#fff;margin:0;padding:20px}
main{max-width:650px;margin:auto}
h1{color:#e8bd65}
section{background:#172235;padding:18px;border-radius:12px;margin:16px 0}
input,button{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;border-radius:7px}
input{background:#fff;border:1px solid #ccc}
button{background:#e8bd65;border:0;font-weight:bold}
.product{border-top:1px solid #455064;padding:12px 0}
.actions{display:flex;gap:8px}
.actions button{flex:1}
#app{display:none}
#status{overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h1>NJ STORE — ADMIN</h1>
<p id="status">Admin login</p>

<section id="login">
<h3>Admin Login</h3>
<input id="email" type="email" placeholder="Admin email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</section>

<div id="app">
<section>
<h3 id="formTitle">Add Product</h3>
<input id="name" placeholder="Product name">
<input id="price" type="number" min="0" step="0.01" placeholder="Price (AED)">
<input id="category" placeholder="Category">
<input id="image" type="url" placeholder="Image URL (optional)">
<button onclick="saveProduct()">Save Product</button>
<button onclick="resetForm()">Cancel Edit</button>
</section>

<section>
<h3>Products</h3>
<button onclick="loadProducts()">Refresh Products</button>
<div id="products">Loading...</div>
</section>
<button onclick="logout()">Logout</button>
</div>
</main>

<script>
const SUPABASE_URL = "https://tjyuuinymsukxggwipwf.supabase.co";
const SUPABASE_KEY = "sb_publishable_zZiP_dclZ_jK46swVBicPA_QxhQuHPD";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let editingId = null;

function status(message) {
  document.getElementById("status").textContent = message;
}

async function login() {
  status("Logging in...");
  const { data, error } = await db.auth.signInWithPassword({
    email: document.getElementById("email").value.trim(),
    password: document.getElementById("password").value
  });
  if (error) {
    status("Login failed: " + error.message);
    return;
  }
  await checkAdmin();
}

async function checkAdmin() {
  const { data: { user } } = await db.auth.getUser();
  if (!user) {
    status("Please log in.");
    return;
  }

  const { data, error } = await db.rpc("is_store_admin");
  if (error || data !== true) {
    await db.auth.signOut();
    status("This account is not an authorized store admin.");
    return;
  }

  document.getElementById("login").style.display = "none";
  document.getElementById("app").style.display = "block";
  status("Admin logged in");
  await loadProducts();
}

async function loadProducts() {
  const area = document.getElementById("products");
  area.textContent = "Loading...";
  const { data, error } = await db.from("products")
    .select("*").order("id", { ascending: false });

  if (error) {
    area.textContent = "Could not load products: " + error.message;
    return;
  }
  area.innerHTML = "";
  if (!data.length) {
    area.textContent = "No products yet.";
    return;
  }

  data.forEach(p => {
    const item = document.createElement("div");
    item.className = "product";
    const title = document.createElement("strong");
    title.textContent = p.name;
    const details = document.createElement("p");
    details.textContent = `AED ${p.price} | ${p.category || "General"}`;
    const actions = document.createElement("div");
    actions.className = "actions";

    const edit = document.createElement("button");
    edit.textContent = "Edit";
    edit.onclick = () => editProduct(p);

    const del = document.createElement("button");
    del.textContent = "Delete";
    del.onclick = () => deleteProduct(p.id, p.name);

    actions.append(edit, del);
    item.append(title, details, actions);
    area.append(item);
  });
}

function editProduct(p) {
  editingId = p.id;
  document.getElementById("name").value = p.name || "";
  document.getElementById("price").value = p.price ?? 0;
  document.getElementById("category").value = p.category || "";
  document.getElementById("image").value = p.image_url || "";
  document.getElementById("formTitle").textContent = "Edit Product";
  window.scrollTo(0, 0);
}

function resetForm() {
  editingId = null;
  ["name", "price", "category", "image"].forEach(id =>
    document.getElementById(id).value = ""
  );
  document.getElementById("formTitle").textContent = "Add Product";
}

async function saveProduct() {
  const name = document.getElementById("name").value.trim();
  const price = Number(document.getElementById("price").value);
  if (!name || document.getElementById("price").value === "" ||
      !Number.isFinite(price) || price < 0) {
    status("Enter a product name and a valid price.");
    return;
  }

  const product = {
    name,
    price,
    category: document.getElementById("category").value.trim() || "General",
    image_url: document.getElementById("image").value.trim()
  };

  status("Saving...");
  const result = editingId
    ? await db.from("products").update(product).eq("id", editingId)
    : await db.from("products").insert(product);

  if (result.error) {
    status("Save failed: " + result.error.message);
    return;
  }

  status("Product saved!");
  resetForm();
  await loadProducts();
}

async function deleteProduct(id, name) {
  if (!confirm(`Delete "${name}"?`)) return;
  const { error } = await db.from("products").delete().eq("id", id);
  if (error) {
    status("Delete failed: " + error.message);
    return;
  }
  status("Product deleted.");
  await loadProducts();
}

async function logout() {
  await db.auth.signOut();
  document.getElementById("app").style.display = "none";
  document.getElementById("login").style.display = "block";
  status("Logged out");
}

(async function start() {
  const { data: { session } } = await db.auth.getSession();
  if (session) await checkAdmin();
})();
</script>
</body>
</html>
