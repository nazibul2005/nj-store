
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nj Store</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f4f4;
      text-align: center;
    }
    header {
      background: #111827;
      color: white;
      padding: 24px;
    }
    .products {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      padding: 20px;
    }
    .product {
      background: white;
      border-radius: 12px;
      padding: 20px;
      width: 130px;
      box-shadow: 0 2px 8px #ddd;
    }
    .emoji { font-size: 40px; }
    button {
      background: #16a34a;
      color: white;
      border: 0;
      padding: 10px;
      border-radius: 7px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🛍️ Nj Store</h1>
    <p>Your Online Shopping Store</p>
  </header>
  <h2>Our Products</h2>
  <div class="products">
    <div class="product">
      <div class="emoji">👕</div>
      <h3>T-Shirt</h3>
      <p>AED 25</p>
      <button onclick="alert('T-Shirt selected!')">Buy Now</button>
    </div>
    <div class="product">
      <div class="emoji">⌚</div>
      <h3>Watch</h3>
      <p>AED 50</p>
      <button onclick="alert('Watch selected!')">Buy Now</button>
    </div>
    <div class="product">
      <div class="emoji">🎧</div>
      <h3>Headphones</h3>
      <p>AED 35</p>
      <button onclick="alert('Headphones selected!')">Buy Now</button>
    </div>
  </div>
</body>
</html>
