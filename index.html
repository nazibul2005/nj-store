
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nj Store</title>
<style>
body{font-family:Arial;margin:0;background:#f3f4f6;text-align:center}
header{background:#111827;color:white;padding:20px}
.products{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;padding:15px}
.product{background:white;border-radius:12px;padding:16px;width:135px;box-shadow:0 2px 8px #ddd}
.emoji{font-size:38px}
button{background:#16a34a;color:white;border:0;padding:10px;border-radius:7px;cursor:pointer}
#cart{background:white;margin:15px;padding:18px;border-radius:12px}
.remove{background:#dc2626;margin-left:8px}
</style>
</head>
<body>
<header>
<h1>🛍️ Nj Store</h1>
<p>Your Online Shopping Store</p>
</header>

<style>
.hero {
  background: linear-gradient(135deg, #d1fae5, #dbeafe);
  margin: 15px;
  padding: 24px 12px;
  border-radius: 16px;
}
.hero h2 {
  color: #111827;
  font-size: 25px;
}
.hero p {
  color: #374151;
}
.product {
  transition: transform 0.2s;
}
.product:hover {
  transform: translateY(-4px);
}
.product img {
  width: 100%;
  height: 110px;
  object-fit: contain;
}
</style>

<div class="hero">
  <h2>Welcome to Nj Store!</h2>
  <p>Find your favourite products at great prices.</p>
</div>  
<input type="text" id="searchInput" placeholder="Search products..." oninput="searchProducts()" style="width:90%;padding:12px;margin:10px 0;border:1px solid #ccc;border-radius:8px;">
  
<h2>Our Products</h2>
<div class="products">
<div class="product">
<img src="
https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400
"
     alt="T-Shirt"
     style="width:100%;height:110px;object-fit:contain;">
<h3>T-Shirt</h3><p>AED 25</p>
<button onclick="add('T-Shirt',25)">Add to Cart</button>
</div>
<div class="product">

<img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400"
     alt="Watch"
     style="width:100%;height:110px;object-fit:contain;">

<h3>Watch</h3><p>AED 50</p>
<button onclick="add('Watch',50)">Add to Cart</button>
</div>
<div class="product">

<div class="product">
  
<img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400"
     alt="Headphones"
     style="width:100%;height:110px;object-fit:contain;">
  
<h3>Headphones</h3><p>AED 35</p>
<button onclick="add('Headphones',35)">Add to Cart</button>
</div>
<div class="product">

<div id="cart">
<h2>🛒 My Shopping Cart</h2>
<div id="items">Your cart is empty.</div>
<h3 id="total">Total: AED 0</h3>
<button onclick="checkout()">Checkout</button>
</div>

<button onclick="orderWhatsApp()">Order on WhatsApp</button>
  
<script>
let cart=[];
function add(name,price){
cart.push({name,price});
render();
}
function removeItem(index){
cart.splice(index,1);
render();
}
function render(){
document.getElementById('items').innerHTML=
cart.length===0?'Your cart is empty.':
cart.map((item,i)=>`${item.name} - AED ${item.price} <button class="remove" onclick="removeItem(${i})">Remove</button>`).join('<br><br>');
document.getElementById('total').textContent=
'Total: AED '+cart.reduce((sum,item)=>sum+item.price,0);
}

function orderWhatsApp(){
  if(cart.length===0){
    alert('Please add products to your cart!');
    return;
  }

  const phone='971543447869';
  const total=cart.reduce((sum,item)=>sum+item.price,0);
  const products=cart.map(item=>item.name+' - AED '+item.price).join('\n');

  const message='Hello Nj Store! I want to order:\n'
    +products
    +'\nTotal: AED '+total;

  window.open(
    'https://wa.me/'+phone+'?text='+encodeURIComponent(message),
    '_blank'
  );
}
  
function searchProducts() {
  const input = document.getElementById('searchInput').value
    .toLowerCase().trim();
  const products = document.querySelectorAll('.product');

  products.forEach(function(product) {
    const text = product.textContent.toLowerCase();
    const words = text.split(/\s+/);
    const found = words.some(function(word) {
      return word.includes(input) ||
        (input.length >= 3 && word.length >= 3 &&
         levenshtein(word, input) <= 1);
    });
    product.style.display = found ? '' : 'none';
  });
}

function levenshtein(a, b) {
  const row = Array.from({length: b.length + 1}, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let prev = row[0];
    row[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const old = row[j];
      row[j] = Math.min(
        row[j] + 1,
        row[j - 1] + 1,
        prev + (a[i - 1] === b[j - 1] ? 0 : 1)
      );
      prev = old;
    }
  }
  return row[b.length];
}

function searchProducts() {
  const input = document.getElementById('searchInput').value.toLowerCase();
  const products = document.querySelectorAll('.product');

  products.forEach(function(product) {
    const text = product.textContent.toLowerCase();
    product.style.display = text.includes(input) ? '' : 'none';
  });
}
  
</script>
</body>
</html>
