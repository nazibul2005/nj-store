
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nj Store</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #030b14;
  color: #f8fafc;
  text-align: center;
}

header {
  background: #06111f;
  border-bottom: 1px solid #c49a36;
  padding: 22px 12px;
}

header h1 {
  margin: 0;
  color: #f6c453;
  font-size: 30px;
}

header p {
  color: #cbd5e1;
}

.hero {
  margin: 18px;
  padding: 35px 18px;
  border: 1px solid #8e6b24;
  border-radius: 18px;
  background: linear-gradient(135deg, #172638, #03070d);
}

.hero h2 {
  color: #f6c453;
  font-size: 30px;
}

.hero p {
  color: #e2e8f0;
}

.search,
.category-filter {
  display: block;
  width: 90%;
  max-width: 500px;
  margin: 12px auto;
  padding: 14px;
  border: 1px solid #334155;
  border-radius: 10px;
  background: #101e2e;
  color: white;
  font-size: 16px;
}

.search::placeholder {
  color: #cbd5e1;
}

.products {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 16px;
  padding: 16px;
}

.product {
  width: 165px;
  max-width: 46%;
  padding: 12px;
  background: linear-gradient(160deg, #142436, #07111d);
  border: 1px solid #4c442d;
  border-radius: 14px;
  box-shadow: 0 5px 20px #0008;
}

.product img {
  width: 100%;
  height: 120px;
  object-fit: contain;
  border-radius: 8px;
  background: #fff;
}

.product h3 {
  color: #fff;
}

.product p {
  color: #f6c453;
  font-weight: bold;
}

button {
  background: linear-gradient(135deg, #ffdc7b, #e6a928);
  color: #101010;
  border: 0;
  border-radius: 9px;
  padding: 11px;
  margin: 4px 2px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  filter: brightness(1.08);
}

.remove {
  background: #dc2626;
  color: white;
}

#cart {
  background: #0b1826;
  border: 1px solid #665024;
  border-radius: 16px;
  margin: 18px;
  padding: 20px 12px;
}

#cart h2,
#cart h3 {
  color: #f6c453;
}

#items {
  line-height: 1.8;
}

#noResults {
  display: none;
  color: #fca5a5;
}

@media (max-width: 380px) {
  .product {
    width: 145px;
  }

  .hero h2 {
    font-size: 24px;
  }
}

</style>
</head>

<body>

<header>
  <h1>🛍️ Nj Store</h1>
  <p>Your Online Shopping Store</p>
</header>

<div class="hero">
  <h2>Welcome to Nj Store!</h2>
  <p>Find your favourite products at great prices.</p>
</div>

<input
  type="text"
  id="searchInput"
  class="search"
  placeholder="Search products..."
  oninput="searchProducts()"
>

<select
  id="categoryFilter"
  class="category-filter"
  onchange="searchProducts()"
>
  <option value="All">All Categories</option>
  <option value="Fashion">Fashion</option>
  <option value="Accessories">Accessories</option>
  <option value="Electronics">Electronics</option>
</select>

<h2>Our Products</h2>

roducts found. Try another spelling.</p>

<div class="products" id="productList">

  <div class="product" data-category="Fashion">
    <img
      src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400"
      alt="T-Shirt"
    >
    <h3>T-Shirt</h3>
    <p>AED 25</p>
    <button onclick="add('T-Shirt',25)">Add to Cart</button>
  </div>

  <div class="product" data-category="Accessories">
    <img
      src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400"
      alt="Watch"
    >
    <h3>Watch</h3>
    <p>AED 50</p>
    <button onclick="add('Watch',50)">Add to Cart</button>
  </div>

  <div class="product" data-category="Electronics">
    <img
      src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400"
      alt="Headphones"
    >
    <h3>Headphones</h3>
    <p>AED 35</p>
    <button onclick="add('Headphones',35)">Add to Cart</button>
  </div>

</div>

<div id="cart">
  <h2>🛒 My Shopping Cart</h2>
  <div id="items">Your cart is empty.</div>
  <h3 id="total">Total: AED 0</h3>
  <button onclick="checkout()">Checkout</button>
</div>

<button class="whatsapp-button" onclick="orderWhatsApp()">
  Order on WhatsApp
</button>

<footer>
  <p>© Nj Store - Online Shopping</p>
</footer>

<script>
let cart = [];

function add(name, price) {
  cart.push({name: name, price: price});
  render();
}

function removeItem(index) {
  cart.splice(index, 1);
  render();
}

function render() {
  const itemsElement = document.getElementById('items');

  if (cart.length === 0) {
    itemsElement.textContent = 'Your cart is empty.';
  } else {
    itemsElement.innerHTML = cart.map(function(item, i) {
      return item.name + ' - AED ' + item.price +
        ' <button class="remove" onclick="removeItem(' +
        i + ')">Remove</button>';
    }).join('<br><br>');
  }

  const total = cart.reduce(function(sum, item) {
    return sum + item.price;
  }, 0);

  document.getElementById('total').textContent =
    'Total: AED ' + total;
}

function checkout() {
  if (cart.length === 0) {
    alert('Please add products to your cart!');
    return;
  }

  alert(
    'Your cart is ready! Please use Order on WhatsApp to place your order.'
  );
}

function orderWhatsApp() {
  if (cart.length === 0) {
    alert('Please add products to your cart!');
    return;
  }

  const phone = '971543447869';

  const total = cart.reduce(function(sum, item) {
    return sum + item.price;
  }, 0);

  const products = cart.map(function(item) {
    return item.name + ' - AED ' + item.price;
  }).join('\n');

  const message =
    'Hello Nj Store! I want to order:\n' +
    products + '\nTotal: AED ' + total;

  const url = 'https://wa.me/' + phone +
    '?text=' + encodeURIComponent(message);

  window.open(url, '_blank');
}

function searchProducts() {
  const input = document.getElementById('searchInput')
    .value.toLowerCase().trim();

  const category = document.getElementById('categoryFilter').value;

  const products = document.querySelectorAll(
    '#productList .product'
  );

  let visibleCount = 0;

  products.forEach(function(product) {
    const name = product.querySelector('h3')
      .textContent.toLowerCase();

    const productCategory = product.dataset.category;

    const categoryMatch =
      category === 'All' || productCategory === category;

    const searchMatch =
      input === '' ||
      name.includes(input) ||
      fuzzyMatch(name, input);

    const found = categoryMatch && searchMatch;

    product.style.display = found ? '' : 'none';

    if (found) {
      visibleCount++;
    }
  });

  document.getElementById('noResults').style.display =
    visibleCount === 0 ? 'block' : 'none';
}

function fuzzyMatch(name, input) {
  const words = name.split(/[^a-z0-9]+/);

  return words.some(function(word) {
    if (word.length < 3) {
      return false;
    }

    if (word.includes(input) || input.includes(word)) {
      return true;
    }

    const distance = levenshtein(word, input);

    const allowedDistance = input.length >= 6 ? 2 : 1;

    return distance <= allowedDistance;
  });
}

function levenshtein(a, b) {
  const row = Array.from(
    {length: b.length + 1},
    function(_, i) {
      return i;
    }
  );

  for (let i = 1; i <= a.length; i++) {
    let previous = row[0];
    row[0] = i;

    for (let j = 1; j <= b.length; j++) {
      const old = row[j];

      row[j] = Math.min(
        row[j] + 1,
        row[j - 1] + 1,
        previous + (a[i - 1] === b[j - 1] ? 0 : 1)
      );

      previous = old;
    }
  }

  return row[b.length];
}
</script>

</body>
</html>
