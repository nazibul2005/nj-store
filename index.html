
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nj Store | Online Shopping</title>
  <meta name="description" content="Shop fashion, accessories and electronics at Nj Store.">
  <style>
    :root {
      --bg: #080b12;
      --panel: #111722;
      --gold: #d9b45b;
      --text: #f5f2e9;
      --muted: #aab1bd;
      --border: #293140;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    header {
      padding: 22px 16px;
      background: #0d111a;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }

    header h1 {
      margin: 0;
      color: var(--gold);
      letter-spacing: 3px;
    }

    header p {
      color: var(--muted);
      margin-bottom: 0;
    }

    .toolbar {
      max-width: 1100px;
      margin: 20px auto;
      padding: 0 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    input, select {
      flex: 1;
      min-width: 140px;
      padding: 13px;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 0 16px 35px;
    }

    h2 { color: var(--gold); }

    #status {
      color: var(--muted);
      font-size: 14px;
    }

    #products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 18px;
    }

    .product {
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .product img {
      display: block;
      width: 100%;
      height: 210px;
      object-fit: cover;
      background: #202633;
    }

    .product-info { padding: 15px; }

    .product-info h3 { margin: 0 0 8px; }

    .category {
      color: var(--muted);
      font-size: 13px;
    }

    .price {
      color: var(--gold);
      font-size: 20px;
      font-weight: bold;
      margin: 12px 0;
    }

    button, .button {
      display: inline-block;
      padding: 11px 14px;
      background: var(--gold);
      color: #111;
      border: 0;
      border-radius: 7px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
    }

    button:hover, .button:hover { opacity: 0.88; }

    .cart-box {
      margin-top: 30px;
      padding: 18px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .cart-item button {
      padding: 7px 10px;
      background: #e06b6b;
    }

    .cart-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }

    #noResults {
      display: none;
      color: var(--muted);
      padding: 20px 0;
    }

    footer {
      padding: 22px;
      color: var(--muted);
      text-align: center;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 480px) {
      .product img { height: 180px; }
    }
  </style>
</head>

<body>
  <header>
    <h1>NJ STORE</h1>
    <p>Style • Quality • Everyday Essentials</p>
  </header>

  <div class="toolbar">
    <input
      id="searchInput"
      type="search"
      placeholder="Search products..."
      aria-label="Search products"
    >

    <select id="categoryFilter" aria-label="Filter by category">
      <option value="All">All Categories</option>
      <option value="Fashion">Fashion</option>
      <option value="Accessories">Accessories</option>
      <option value="Electronics">Electronics</option>
    </select>
  </div>

  <main>
    <h2>Our Products</h2>
    <p id="status">Loading products...</p>
    <div id="products"></div>
    <p id="noResults">No products found. Try another spelling.</p>

    <section class="cart-box">
      <h2>Shopping Cart (<span id="cartCount">0</span>)</h2>
      <div id="cartItems">Your cart is empty.</div>
      <h3>Total: AED <span id="cartTotal">0.00</span></h3>

      <div class="cart-actions">
        <button id="clearCartButton" type="button">Clear Cart</button>
        <button id="checkoutButton" type="button">Order on WhatsApp</button>
      </div>
    </section>
  </main>

  <footer>
    <p>© <span id="year"></span> Nj Store. All rights reserved.</p>
  </footer>

  <script>
    // Replace this value with your Supabase Publishable Key.
    const SUPABASE_URL =
      'https://tjyuuinymsukxggwipwf.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_zZiP_dclZ_jK46swVBicPA_QxhQuHPD';

    const WHATSAPP_NUMBER = '971543447869';

    const fallbackProducts = [
      {
        id: 'demo-shirt',
        name: 'T-Shirt',
        price: 25,
        category: 'Fashion',
        image_url:
          'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400'
      },
      {
        id: 'demo-watch',
        name: 'Watch',
        price: 50,
        category: 'Accessories',
        image_url:
          'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400'
      },
      {
        id: 'demo-headphones',
        name: 'Headphones',
        price: 35,
        category: 'Electronics',
        image_url:
          'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400'
      }
    ];

    let products = [];
    let cart = [];

    const productsElement = document.getElementById('products');
    const searchInput = document.getElementById('searchInput');
    const categoryFilter = document.getElementById('categoryFilter');
    const statusElement = document.getElementById('status');
    const noResults = document.getElementById('noResults');

    function safeText(value) {
      return String(value ?? '');
    }

    function renderProducts() {
      const query = searchInput.value.trim().toLowerCase();
      const category = categoryFilter.value;

      const filtered = products.filter(product => {
        const name = safeText(product.name).toLowerCase();
        const productCategory = safeText(product.category);

        const matchesSearch = name.includes(query);
        const matchesCategory =
          category === 'All' || productCategory === category;

        return matchesSearch && matchesCategory;
      });

      productsElement.replaceChildren();

      filtered.forEach(product => {
        const card = document.createElement('article');
        card.className = 'product';

        const img = document.createElement('img');
        img.src = product.image_url || '';
        img.alt = safeText(product.name);
        img.loading = 'lazy';

        img.addEventListener('error', () => {
          img.style.display = 'none';
        });

        const info = document.createElement('div');
        info.className = 'product-info';

        const name = document.createElement('h3');
        name.textContent = safeText(product.name);

        const categoryText = document.createElement('div');
        categoryText.className = 'category';
        categoryText.textContent = safeText(product.category);

        const price = document.createElement('div');
        price.className = 'price';
        price.textContent =
          'AED ' + Number(product.price || 0).toFixed(2);

        const addButton = document.createElement('button');
        addButton.type = 'button';
        addButton.textContent = 'Add to Cart';
        addButton.addEventListener('click', () => {
          addToCart(product.id);
        });

        info.append(name, categoryText, price, addButton);
        card.append(img, info);
        productsElement.append(card);
      });

      noResults.style.display = filtered.length ? 'none' : 'block';
    }

    async function loadSupabaseProducts() {
      statusElement.textContent = 'Connecting to Supabase...';

      try {
        const response = await fetch(
          SUPABASE_URL + '/rest/v1/products?select=id,name,price,category,image_url&order=id.desc',
          {
            headers: {
              apikey: SUPABASE_KEY,
              Authorization: 'Bearer ' + SUPABASE_KEY
            }
          }
        );

        if (!response.ok) {
          throw new Error('Supabase request failed: ' + response.status);
        }

        const data = await response.json();

        products = Array.isArray(data) ? data : [];
        statusElement.textContent =
          'Products loaded: ' + products.length;

      } catch (error) {
        console.error('Supabase error:', error);
        products = fallbackProducts;
        statusElement.textContent =
          'Could not connect to Supabase. Showing sample products.';
      }

      renderProducts();
    }

    function addToCart(productId) {
      const product = products.find(
        item => String(item.id) === String(productId)
      );

      if (!product) return;

      cart.push(product);
      renderCart();
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      renderCart();
    }

    function renderCart() {
      const cartItems = document.getElementById('cartItems');
      cartItems.replaceChildren();

      document.getElementById('cartCount').textContent = cart.length;

      if (cart.length === 0) {
        cartItems.textContent = 'Your cart is empty.';
      } else {
        cart.forEach((item, index) => {
          const row = document.createElement('div');
          row.className = 'cart-item';

          const description = document.createElement('span');
          description.textContent =
            safeText(item.name) + ' — AED ' +
            Number(item.price || 0).toFixed(2);

          const removeButton = document.createElement('button');
          removeButton.type = 'button';
          removeButton.textContent = 'Remove';
          removeButton.addEventListener('click', () => {
            removeFromCart(index);
          });

          row.append(description, removeButton);
          cartItems.append(row);
        });
      }

      const total = cart.reduce(
        (sum, item) => sum + Number(item.price || 0), 0
      );

      document.getElementById('cartTotal').textContent =
        total.toFixed(2);
    }

    searchInput.addEventListener('input', renderProducts);
    categoryFilter.addEventListener('change', renderProducts);

    document.getElementById('clearCartButton')
      .addEventListener('click', () => {
        cart = [];
        renderCart();
      });

    document.getElementById('checkoutButton')
      .addEventListener('click', () => {
        if (cart.length === 0) {
          alert('Your cart is empty. Add a product first.');
          return;
        }

        const lines = cart.map(item =>
          safeText(item.name) + ' - AED ' +
          Number(item.price || 0).toFixed(2)
        );

        const total = cart.reduce(
          (sum, item) => sum + Number(item.price || 0), 0
        );

        const message =
          'Hello Nj Store! I want to order:\n' +
          lines.join('\n') +
          '\nTotal: AED ' + total.toFixed(2);

        const url =
          'https://wa.me/' + WHATSAPP_NUMBER +
          '?text=' + encodeURIComponent(message);

        window.open(url, '_blank');
      });

    document.getElementById('year').textContent =
      new Date().getFullYear();

    renderCart();
    loadSupabaseProducts();
  </script>
</body>
</html>
